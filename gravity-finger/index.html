<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05070b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>GRAVITY FINGER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}#app{position:fixed;inset:0;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.lab{font-size:10px;letter-spacing:.18em;opacity:.55}.val{font-size:23px;font-weight:900}.right{text-align:right}#chargeWrap{position:absolute;left:16px;right:16px;bottom:max(15px,env(safe-area-inset-bottom));height:7px;border-radius:20px;background:#ffffff1c;overflow:hidden;pointer-events:none}#charge{height:100%;width:0;background:linear-gradient(90deg,#70e5ff,#fff);box-shadow:0 0 16px #7ce9ff}#hint{position:absolute;left:50%;bottom:calc(max(15px,env(safe-area-inset-bottom)) + 24px);transform:translateX(-50%);white-space:nowrap;background:#09111dcc;border:1px solid #ffffff22;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:800;letter-spacing:.05em;pointer-events:none;transition:opacity .3s}#badge{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 52px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;letter-spacing:.12em;opacity:0;pointer-events:none}#over{position:absolute;inset:0;background:#02050ae8;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5}#over.hide{display:none}.title{font-size:34px;font-weight:950;letter-spacing:.03em}.desc{opacity:.72;line-height:1.65;margin:10px auto 22px;max-width:330px;font-size:14px}button{border:0;border-radius:999px;background:#fff;color:#05070b;font-size:16px;font-weight:900;padding:14px 26px;min-width:160px}.small{font-size:11px;opacity:.45;margin-top:15px}</style></head><body><div id="app"><canvas id="c"></canvas><div id="hud"><div><div class="lab">SCORE</div><div class="val" id="score">0000</div></div><div class="right"><div class="lab">LIFE</div><div class="val" id="life">● ● ●</div></div></div><div id="badge"></div><div id="hint">指を置く → 重力　　離す → 射出</div><div id="chargeWrap"><div id="charge"></div></div><div id="over"><div><div class="title">GRAVITY<br>FINGER</div><div class="desc">自機は止まらない。<br>画面に指を置くと、その位置が重力源になる。<br>隕石すれすれを抜けてエネルギーを溜めろ。</div><button id="start">START</button><div class="small">縦持ち・片手操作</div></div></div></div><script>(function(){'use strict';var c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),chargeEl=document.getElementById('charge'),hint=document.getElementById('hint'),badge=document.getElementById('badge'),over=document.getElementById('over');var W=0,H=0,D=1,ship,rocks=[],trail=[],stars=[],parts=[],rings=[],g={down:false,x:0,y:0},score=0,life=3,charge=0,combo=0,spawn=0,elapsed=0,inv=0,playing=false,last=performance.now();function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs,{passive:true});rs();function rnd(a,b){return a+Math.random()*(b-a)}function cl(v,a,b){return Math.max(a,Math.min(b,v))}function reset(){ship={x:W*.28,y:H*.52,vx:175,vy:-20,r:8};rocks=[];trail=[];parts=[];rings=[];stars=[];for(var i=0;i<Math.max(55,Math.floor(W*H/7000));i++)stars.push({x:Math.random()*W,y:Math.random()*H,a:rnd(.15,.65),s:rnd(.5,1.6)});score=0;life=3;charge=0;combo=0;spawn=.5;elapsed=0;inv=0;g.down=false;sync()}function sync(){scoreEl.textContent=('0000'+Math.floor(score)).slice(-4);lifeEl.textContent=life?Array(life+1).join('● '):'—';chargeEl.style.width=cl(charge,0,100)+'%'}function rock(){var side=Math.floor(Math.random()*4),m=30,s=rnd(60,110)+elapsed*.9,x,y,vx,vy;if(side===0){x=-m;y=rnd(70,H-70);vx=s;vy=rnd(-.55,.55)*s}else if(side===1){x=W+m;y=rnd(70,H-70);vx=-s;vy=rnd(-.55,.55)*s}else if(side===2){x=rnd(20,W-20);y=-m;vx=rnd(-.55,.55)*s;vy=s}else{x=rnd(20,W-20);y=H+m;vx=rnd(-.55,.55)*s;vy=-s}rocks.push({x:x,y:y,vx:vx,vy:vy,r:rnd(11,22),near:false,a:rnd(0,6.28),sp:rnd(-2,2),dead:false})}function grav(o,k,dt){if(!g.down)return;var dx=g.x-o.x,dy=g.y-o.y,r2=dx*dx+dy*dy+2400,r=Math.sqrt(r2),a=Math.min(3200000/r2,800)*k;o.vx+=dx/r*a*dt;o.vy+=dy/r*a*dt}function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=rnd(60,190);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.25,.65)})}}function say(t){badge.textContent=t;badge.style.transition='none';badge.style.opacity='1';badge.style.transform='translateX(-50%) scale(1.1)';requestAnimationFrame(function(){badge.style.transition='opacity .5s,transform .5s';badge.style.opacity='0';badge.style.transform='translateX(-50%) scale(1)'})}function shock(){hint.style.opacity='0';if(charge<18){charge*=.2;return}var rad=95+charge*1.45,h=0;rings.push({x:ship.x,y:ship.y,r:8,max:rad,t:.42});for(var i=0;i<rocks.length;i++){var o=rocks[i],dx=o.x-ship.x,dy=o.y-ship.y,d=Math.hypot(dx,dy)||1;if(d<rad){var k=1-d/rad;o.vx+=dx/d*(230+charge*4.5)*k;o.vy+=dy/d*(230+charge*4.5)*k;if(d<rad*.52||charge>76){o.dead=true;h++;burst(o.x,o.y,7)}}}if(h){score+=h*45*(1+combo*.12);say(h>1?'CHAIN BREAK ×'+h:'BREAK');combo+=h}else combo=Math.max(0,combo-1);charge=0}function hit(o){if(inv>0)return;life--;inv=1.1;combo=0;charge=Math.max(0,charge-28);ship.vx*=-.62;ship.vy*=-.62;o.dead=true;burst(ship.x,ship.y,16);if(navigator.vibrate)navigator.vibrate(25);if(life<=0){playing=false;setTimeout(function(){over.classList.remove('hide');over.querySelector('.title').innerHTML='RUN OVER';over.querySelector('.desc').innerHTML='SCORE <b>'+Math.floor(score)+'</b><br><br>危険な軌道ほどチャージが速い。';document.getElementById('start').textContent='RETRY'},180)}}function step(dt){if(!playing)return;elapsed+=dt;if(inv>0)inv-=dt;spawn-=dt;if(spawn<=0){rock();spawn=rnd(Math.max(.48,.95-elapsed*.009),Math.max(.65,1.25-elapsed*.008))}grav(ship,1,dt);var spd=Math.hypot(ship.vx,ship.vy);if(spd>720){ship.vx*=720/spd;ship.vy*=720/spd}ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;if(ship.x<-15)ship.x=W+15;if(ship.x>W+15)ship.x=-15;if(ship.y<-15)ship.y=H+15;if(ship.y>H+15)ship.y=-15;trail.push({x:ship.x,y:ship.y,t:.6});if(trail.length>90)trail.shift();for(var i=0;i<rocks.length;i++){var o=rocks[i];grav(o,.28,dt);o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.sp*dt;var dx=o.x-ship.x,dy=o.y-ship.y,d=Math.hypot(dx,dy);if(d<o.r+ship.r)hit(o);if(d<o.r+52&&d>o.r+ship.r+4&&!o.near){o.near=true;charge=cl(charge+cl(11+spd/35,11,29),0,100);score+=14+combo*2;combo++;say(combo>=4?'NEAR ×'+combo:'NEAR');if(navigator.vibrate)navigator.vibrate(7)}if(d>o.r+88)o.near=false}rocks=rocks.filter(function(o){return !o.dead&&o.x>-120&&o.x<W+120&&o.y>-120&&o.y<H+120});for(i=0;i<trail.length;i++)trail[i].t-=dt;trail=trail.filter(function(t){return t.t>0});for(i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.t-=dt}parts=parts.filter(function(p){return p.t>0});for(i=0;i<rings.length;i++){rings[i].t-=dt;rings[i].r+=(rings[i].max-rings[i].r)*Math.min(1,dt*12)}rings=rings.filter(function(r){return r.t>0});score+=dt*(1+Math.min(4,spd/180));sync()}function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=s.a;ctx.fillStyle='#dcecff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;for(i=0;i<trail.length;i++){var t=trail[i];ctx.globalAlpha=cl(t.t/.6,0,1)*.32;ctx.fillStyle='#80e9ff';ctx.beginPath();ctx.arc(t.x,t.y,1.3,0,6.283);ctx.fill()}ctx.globalAlpha=1;if(g.down){var gr=ctx.createRadialGradient(g.x,g.y,3,g.x,g.y,100);gr.addColorStop(0,'rgba(210,250,255,.22)');gr.addColorStop(.25,'rgba(90,215,255,.11)');gr.addColorStop(1,'rgba(60,120,255,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,100,0,6.283);ctx.fill();ctx.strokeStyle='rgba(210,250,255,.48)';ctx.lineWidth=1;for(var q=0;q<3;q++){ctx.beginPath();ctx.arc(g.x,g.y,24+q*20+(performance.now()/40)%8,0,6.283);ctx.stroke()}}for(i=0;i<rings.length;i++){var rr=rings[i];ctx.globalAlpha=cl(rr.t/.42,0,1);ctx.strokeStyle='#e8fdff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rr.x,rr.y,rr.r,0,6.283);ctx.stroke()}ctx.globalAlpha=1;for(i=0;i<rocks.length;i++){var o=rocks[i];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.a);ctx.fillStyle='#0c1219';ctx.strokeStyle=o.near?'#fff':'#8e9bab';ctx.lineWidth=o.near?2:1.2;ctx.beginPath();for(var j=0;j<7;j++){var a=j/7*6.283,r=o.r*(.84+.14*Math.sin(j*2.7+o.r)),x=Math.cos(a)*r,y=Math.sin(a)*r;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=cl(p.t/.65,0,1);ctx.fillStyle='#eaffff';ctx.fillRect(p.x-1,p.y-1,2,2)}ctx.globalAlpha=1;ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(Math.atan2(ship.vy,ship.vx));if(inv>0&&Math.floor(inv*14)%2===0)ctx.globalAlpha=.22;ctx.fillStyle='#7de8ff';ctx.fillRect(-17,-2,9,4);ctx.fillStyle='#fff';ctx.strokeStyle='#a5f0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-5,0);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();ctx.globalAlpha=1}function pos(t){var r=c.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}c.addEventListener('touchstart',function(e){if(!playing||!e.touches||e.touches.length!==1)return;var p=pos(e.touches[0]);g.down=true;g.x=p.x;g.y=p.y;e.preventDefault()},{passive:false});c.addEventListener('touchmove',function(e){if(!g.down||!e.touches||!e.touches.length)return;var p=pos(e.touches[0]);g.x=p.x;g.y=p.y;e.preventDefault()},{passive:false});c.addEventListener('touchend',function(e){if(!g.down)return;g.down=false;shock();e.preventDefault()},{passive:false});c.addEventListener('touchcancel',function(){if(g.down){g.down=false;shock()}},{passive:true});c.addEventListener('mousedown',function(e){if(!playing)return;g.down=true;g.x=e.clientX;g.y=e.clientY});addEventListener('mousemove',function(e){if(g.down){g.x=e.clientX;g.y=e.clientY}});addEventListener('mouseup',function(){if(g.down){g.down=false;shock()}});document.getElementById('start').addEventListener('click',function(){reset();over.classList.add('hide');playing=true;last=performance.now()});function loop(now){var dt=Math.min(.033,(now-last)/1000||.016);last=now;step(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
